[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "authsources_keycloak"
version = "0.4"
authors = [
    {name = "Souheil Chelfouh", email = "trollfot@gmail.com"},
]
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "authsources >= 0.5",
  "python-keycloak",
]

[project.optional-dependencies]
test = [
    'pytest',
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["authsources_keycloak"]
namespaces = false
